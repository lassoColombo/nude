[package]
name = "nude"
version = "0.1.0"
edition = "2024"
description = "Introspection-only Docker integration for Nushell (a nu-plugin)"

[[bin]]
name = "nu_plugin_nude"
path = "src/main.rs"

[dependencies]
nu-plugin = "0.115"
nu-protocol = "0.115"
bollard = "0.21"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = "1"
serde_json = "1"
anyhow = "1"
chrono = "0.4"
